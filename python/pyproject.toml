[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ptywrap"
version = "0.1.0"
description = "Python bindings for ptywrap - PTY container emulator library"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "GPL-2.0-or-later"}
authors = [
    {name = "SUSE Linux", email = "okir@suse.com"}
]
keywords = ["pty", "tty", "terminal", "container", "podman", "testing", "emulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/openSUSE/ptywrap"
"Bug Reports" = "https://github.com/openSUSE/ptywrap/issues"
Source = "https://github.com/openSUSE/ptywrap"

[project.optional-dependencies]
dev = ["pytest>=6.0", "pytest-timeout>=1.4"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages]
find = {}
